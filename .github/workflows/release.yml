# Release-Workflow für das Glorious Community Plugin Repository
#
# Tag-getriggert: git tag <plugin>-<version> && git push origin <tag>
# z. B. `wiki-1.2.0` -> Plugin "wiki", Version "1.2.0".
#
# Zusätzlich manuell auslösbar (workflow_dispatch) mit Input `version` — damit
# lässt sich die Pipeline end-to-end OHNE Tag verifizieren. Ein manueller Lauf
# legt KEINEN Git-Tag an; er baut/veröffentlicht lediglich genau den Tag, der im
# Input `version` steht (z. B. hello-9.9.9). Der Tag-Push-Trigger bleibt aktiv.
#
# Gitea-Zugriff: Alle Gitea-Operationen (Release anlegen, Assets hochladen,
# Assets/Hashes lesen) laufen über die Gitea-REST-API mit `curl`, NICHT über die
# gh-CLI (im Runner-Image nicht vorhanden). Der GitHub-Mirror nutzt ebenfalls
# `curl` gegen api.github.com. Die Gitea-Basis-URL kommt aus der Workflow-Env
# `GITEA_URL` (Default http://glorious-gitea-1:3000 im Runner-Netz) — niemals
# localhost:3000 (= der Container selbst) und niemals github.server_url.
#
# Der Workflow baut das Plugin-Binary in einer GOOS/GOARCH-Matrix, signiert das
# manifest.json mit dem Ed25519-Key aus dem Secret SIGNING_KEY, validiert README
# und functions.json, erzeugt die .glorious-plugin-ZIPs und veröffentlicht das
# Release auf GITEA (Source of Truth). Danach spiegelt der Job `mirror-github`
# die Assets nach GitHub (Push-Mirror, der NUR Git-Refs spiegelt, keine Releases),
# der Job `update-index` pinnt index.json auf die AUSGELIEFERTEN Bytes und
# `verify-consistency` prüft abschließend Gitea-Asset == GitHub-Asset == index.json.
#
# Reihenfolge: release -> mirror-github -> update-index -> verify-consistency.
# (update-index liest bewusst die GITEA-Bytes, weil Gitea die Quelle ist; der
#  Mirror-Job läuft VORHER, damit die Konsistenzprüfung beide Hosts vorfindet.)
#
# Secrets (Repository > Settings > Secrets and variables > Actions):
#   SIGNING_KEY   PFLICHT. Ed25519-Private-Key des Autors — PKCS#8-PEM ("-----BEGIN
#                 PRIVATE KEY-----", mehrzeilig) ODER Base64 davon. Wird NIE ausgegeben.
#                 OHNE dieses Secret bricht der Workflow im Schritt "Signing-Key
#                 bereitstellen" VOR jedem Build ab (fail-closed, alle Matrix-Beine
#                 rot mit derselben Ursache). Einmalig setzen:
#                   openssl genpkey -algorithm ed25519 -out key.pem
#                   (GitHub: gh secret set SIGNING_KEY --repo <owner>/<repo> < key.pem)
#                 (oder Gitea: Repository > Settings > Actions > Secrets — dort den
#                  Inhalt von key.pem als Secret SIGNING_KEY anlegen; die gh-CLI ist
#                  im Gitea-Runner-Image nicht vorhanden).
#                 Siehe README §4 "Signing-Key".
#
#   GIT_TOKEN     PFLICHT für Release + Mirrors + index.json-Sync. Gitea-Token
#                 (Source of Truth); Release-Assets und index.json liegen dort.
#                 Benötigt Repo-Scope write:repository (Repo-Admin für Releases).
#                 Ein reiner github.token reicht NICHT. Ohne das Secret bricht der
#                 Schritt "Release-Assets hochladen" mit einem Publish-Fail-Fast ab.
#                 Hinweis: Die Namen GITEA_TOKEN und GITHUB_TOKEN sind in Gitea
#                 RESERVIERT (HTTP 400 "invalid variable or secret name") und
#                 können nicht gesetzt werden — daher GIT_TOKEN.
#                 Siehe README §4 "Publish-Secret".
#
#   GH_PAT        PFLICHT für den GitHub-Mirror. Classic GitHub-PAT (Scopes
#                 repo + workflow) zum Anlegen des GitHub-Releases und Hochladen
#                 der Assets. Ohne das Secret bricht der Job `mirror-github` ab
#                 (fail-closed). Hinweis: GITHUB_PAT ist in Gitea ebenfalls
#                 RESERVIERT (HTTP 400) — daher GH_PAT.
#                 Siehe README §4 "GitHub-Mirror-Secret".
#
# MIT License — Vorlage für Plugin-Autoren, frei anpassbar.
#
# EU AI Act transparency notice (Art. 50, Regulation (EU) 2024/1689): Mit
# KI-Unterstützung erstellt.
name: Release Plugin

on:
  push:
    tags:
      - "*-*.*.*" # Plugin-Tags im Format <plugin>-<version> (SemVer), z. B. hello-0.1.0.
                  # Bootstrap-Tags wie v0.1.0 (manuell erstellte Team-Releases) triggern den Workflow nicht.
  workflow_dispatch:
    inputs:
      version:
        description: "Tag to build/verify, e.g. hello-9.9.9 (no tag is created/pushed by this workflow)."
        required: false
        default: "1.0.0"

# Base URL of the Gitea instance that acts as the Source of Truth (hosts the
# release, the release assets and index.json). Must be reachable from inside
# the runner job container: the runner network resolves the Gitea service by
# its compose service name (http://glorious-gitea-1:3000), NOT via
# localhost:3000 and NOT via the public github.server_url. Override per-run
# by exporting GITEA_URL in the job/step env when the topology differs.
env:
  GITEA_URL: "http://glorious-gitea-1:3000"

permissions:
  contents: write # for release/index.json writes via the Gitea REST API

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            ext: .exe
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: darwin
            goarch: arm64
            ext: ""
    runs-on: ubuntu-latest
    env:
      # PLUGIN_NAME carries the release tag. For a tag push it is github.ref_name
      # (e.g. wiki-1.2.0). For a manual workflow_dispatch run there is no tag, so
      # we fall back to the 'version' input (a caller-supplied tag such as
      # hello-9.9.9) and, if that is empty, to a safe default. A workflow_dispatch
      # run therefore only VERIFIES the pipeline end to end; it never creates a
      # git tag (the workflow never runs 'git tag'/'git push' of a tag).
      PLUGIN_NAME: ${{ github.event.inputs.version || github.ref_name }}
      GO_VERSION: "1.26"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Plugin-Name und Version aus dem Tag ableiten
        id: tag
        shell: bash
        run: |
          # Tag-Format: <plugin>-<version> mit SemVer-Version, z. B. wiki-1.2.0.
          name="${PLUGIN_NAME%-*}"
          version="${PLUGIN_NAME##*-}"
          if [[ -z "$name" || ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '$PLUGIN_NAME' entspricht nicht <plugin>-<version> (SemVer)." >&2
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Signing-Key bereitstellen (PEM oder Base64)
        shell: bash
        run: |
          # Akzeptiert PKCS#8-PEM und Base64(PEM). Das Secret wird nur in
          # key.pem materialisiert und ist nie in Logs/Outputs sichtbar.
          #
          # Fail-closed VOR jedem Build: fehlt das Secret (oder ist es leer),
          # brechen wir hier mit einer Handlungsanweisung ab, statt den Fehler
          # erst im Signieren-Schritt als kryptischen Key-Längenfehler zu
          # zeigen. Der Fehlertext ist bewusst EINDEUTIG und nennt den Fix.
          if [[ -z "${SIGNING_KEY:-}" ]]; then
            echo "::error::Repository-Secret SIGNING_KEY fehlt oder ist leer. Ohne Ed25519-Signing-Key kann kein Plugin-ZIP signiert werden." >&2
            echo "Fix: openssl genpkey -algorithm ed25519 -out key.pem && gh secret set SIGNING_KEY --repo '${GITHUB_REPOSITORY}' --body \"\$(cat key.pem)\"" >&2
            echo "Oder: Repository > Settings > Secrets and variables > Actions > New repository secret 'SIGNING_KEY' (Inhalt von key.pem, PEM oder Base64). Siehe README §4." >&2
            exit 1
          fi
          printf '%s' "$SIGNING_KEY" > key.pem
          if ! grep -q -- "-----BEGIN" key.pem; then
            if ! base64 -d key.pem > key.dec 2>/dev/null; then
              echo "SIGNING_KEY ist weder PEM noch Base64." >&2
              exit 1
            fi
            mv key.dec key.pem
          fi
          # Zweite Absicherung: der materialisierte Key muss ein Ed25519-PKCS#8-
          # Key sein. Ein falsches Secret (z. B. ein abgeschnittener Wert)
          # scheitert damit hier, nicht erst im teuren Matrix-Build.
          if ! openssl pkey -in key.pem -noout >/dev/null 2>&1; then
            echo "::error::SIGNING_KEY ist kein gültiger PKCS#8-Private-Key (openssl pkey lehnt ihn ab)." >&2
            exit 1
          fi
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            plugins/${{ steps.tag.outputs.name }}/go.mod
            tools/build-plugin/go.mod

      - name: Builder-Tooling bauen
        working-directory: tools/build-plugin
        run: go build -o ../../build-plugin .

      - name: Plugin-Binary bauen (${{ matrix.goos }}/${{ matrix.goarch }})
        shell: bash
        working-directory: plugins/${{ steps.tag.outputs.name }}
        run: |
          # Go-Plugins: direkt bauen. Andere Sprachen: build.sh bereitstellen.
          # Das Binary heisst wie das Plugin (<name>), passend zum Manifest-
          # Entrypoint ./<name> (bzw. ./<name>.exe unter Windows) — der
          # Plugin-Host loest den Entrypoint WOERTLICH relativ zum Arbeits-
          # verzeichnis auf und leitet KEINE .exe-Endung ab.
          if [[ -f go.mod ]]; then
            GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
              go build -trimpath -ldflags "-s -w" -o "${{ steps.tag.outputs.name }}${{ matrix.ext }}" .
          elif [[ -f build.sh ]]; then
            GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} ./build.sh "${{ steps.tag.outputs.name }}${{ matrix.ext }}"
          else
            echo "plugins/<name> braucht go.mod oder build.sh." >&2
            exit 1
          fi

      - name: Manifest-Entrypoint an die Plattform anpassen
        id: entry
        shell: bash
        working-directory: plugins/${{ steps.tag.outputs.name }}
        run: |
          # M1-Fix: ein einziges Repo-Manifest kann nicht gleichzeitig "./hello"
          # (Unix) und "./hello.exe" (Windows) fordern. Der Host loest den
          # Entrypoint woertlich auf, wir patchen deshalb eine KOPIE des
          # Manifests je Matrix-Lauf und lassen das Repo-Manifest unangetastet.
          # Der Unix-Name ist der Repo-Default (./hello); Windows bekommt .exe.
          cp manifest.json manifest.build.json
          if [[ "${{ matrix.goos }}" == "windows" ]]; then
            entry="./${{ steps.tag.outputs.name }}.exe"
          else
            entry="./${{ steps.tag.outputs.name }}"
          fi
          # Kein Heredoc: der YAML-Block-Skalar endet an einer Zeile ohne
          # Einrueckung, ein Heredoc-Body auf Spalte 0 wuerde die YAML-Struktur
          # zerstoeren. Daher ein einzelner python3 -c-Aufdruck.
          # python3 statt python: auf ubuntu-latest ist nur python3 garantiert;
          # ein fehlendes python3 wuerde das Manifest sonst still unverändert
          # lassen und der Build nur warnen (entrypoint != binary) statt failen.
          py="$(command -v python3 || command -v python)"
          if [[ -z "$py" ]]; then
            echo "python3/python fehlt — Manifest-Patch nicht moeglich." >&2
            exit 1
          fi
          "$py" -c 'import json,sys; p=sys.argv[1]; d=json.load(open(p,encoding="utf-8")); d["entrypoint"]=sys.argv[2]; open(p,"w",encoding="utf-8").write(json.dumps(d,indent=2,ensure_ascii=False)+"\n")' manifest.build.json "$entry"
          # Verifizieren, dass der Patch wirklich landete, statt dem Build zu
          # vertrauen (er warnt nur, wenn Entrypoint != Binary-Name).
          "$py" -c 'import json,sys; d=json.load(open("manifest.build.json",encoding="utf-8")); assert d["entrypoint"]==sys.argv[1], d["entrypoint"]' "$entry"
          echo "entrypoint=$entry" >> "$GITHUB_OUTPUT"

      - name: Plugin-ZIP bauen, validieren und signieren
        shell: bash
        working-directory: plugins/${{ steps.tag.outputs.name }}
        run: |
          set -euo pipefail
          bin="${{ steps.tag.outputs.name }}${{ matrix.ext }}"
          out="../../${{ steps.tag.outputs.name }}-${{ matrix.goos }}-${{ matrix.goarch }}.glorious-plugin"
          # Das gepatchte Manifest (manifest.build.json) geht in das ZIP, damit
          # der Entrypoint exakt zum Binary-Namen im Archiv passt (Windows:
          # hello.exe). Die Signatur deckt damit das plattformkorrekte Manifest ab.
          args=(--manifest manifest.build.json --functions functions.json --readme README.md
                --binary "$bin" --out "$out" --signing-key ../../key.pem)
          [[ -d assets ]] && args+=(--asset assets)
          ../../build-plugin "${args[@]}"
          rm -f manifest.build.json

      - name: Prüfsummen + Public Key ermitteln
        id: asset
        shell: bash
        run: |
          file="${{ steps.tag.outputs.name }}-${{ matrix.goos }}-${{ matrix.goarch }}.glorious-plugin"
          echo "sha256=$(sha256sum "$file" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "asset=$file" >> "$GITHUB_OUTPUT"
          # build-plugin wurde ins Repo-Root gebaut; dieser Schritt läuft dort.
          echo "pubkey=$(./build-plugin --print-pubkey --signing-key key.pem)" >> "$GITHUB_OUTPUT"

      - name: ZIP validieren (Einträge, Entrypoint vs. Binary, Ed25519-Signatur)
        shell: bash
        # The Go module that owns verify-zip is tools/build-plugin; there is NO
        # go.mod at the repo root. Running 'go build' at the root therefore
        # aborts with "go: cannot find main module, but found .git/config".
        # Build inside the module directory and emit the binary to the repo root,
        # where key.pem and the built asset live (earlier steps run at the root).
        working-directory: tools/build-plugin
        run: |
          # Verifiziert das soeben erzeugte Asset gegen den public Key des
          # Signing-Keys. Ohne diesen Schritt war "validieren" im Build-Schritt
          # nur eine Zusicherung; jetzt ist es ein Gate: Entrypoint muss im
          # Archiv liegen und die Manifest-Signatur matchen.
          # Fail-closed: a build failure must abort before the release is
          # published, so the gate cannot silently pass.
          go build -o ../../verify-zip ./verify-zip
          ../../verify-zip "../../${{ steps.asset.outputs.asset }}" ../../key.pem

      - name: Release-Assets hochladen (Gitea REST API)
        env:
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Fail-closed: without the publish secret no release can be created.
          # CI runs on Gitea (Source of Truth); the release and index.json live
          # there, so a bare github.token would silently target the wrong host.
          if [[ -z "${GIT_TOKEN:-}" ]]; then
            echo "::error::Publish-Secret GIT_TOKEN fehlt oder ist leer. Release/index.json liegen auf Gitea (Source of Truth)." >&2
            echo "Fix: Repository > Settings > Actions > Secrets > New secret 'GIT_TOKEN' (Repo-Scope write:repository, Admin für Releases). Siehe README §4 'Publish-Secret'." >&2
            exit 1
          fi
          # The Gitea base URL is configured via the workflow env GITEA_URL
          # (see top of file). It must be reachable from inside the job
          # container — localhost:3000 points at the container itself and the
          # public github.server_url is the host-facing URL, so neither works.
          if [[ -z "${GITEA_URL:-}" ]]; then
            echo "::error::GITEA_URL ist nicht gesetzt (Workflow-env fehlt)." >&2
            exit 1
          fi
          asset="${{ steps.asset.outputs.asset }}"
          tag="${{ steps.tag.outputs.name }}-${{ steps.tag.outputs.version }}"
          repo="${GH_REPOSITORY}"
          api="${GITEA_URL%/}/api/v1/repos/${repo}"
          auth=( -H "Authorization: token ${GIT_TOKEN}" )

          # Fail-closed preflight: never publish blind. A GET that is not 2xx
          # (bad token / wrong host / missing repo) aborts here.
          code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 60 "${auth[@]}" "${api}/releases")"
          if [[ "${code:0:1}" != "2" ]]; then
            echo "::error::Gitea-API ${api}/releases antwortete mit HTTP ${code} — Token/Host pruefen (GITEA_URL=${GITEA_URL})." >&2
            exit 1
          fi

          # Release is idempotent: POST creates it (or fails if the tag already
          # has a release); GET by tag returns the existing one. Required field
          # per CreateReleaseOption is tag_name; draft/prerelease are explicit
          # so provider defaults cannot flip them. The API response is a Release
          # object whose integer 'id' is what the asset-upload endpoint needs.
          rel_code="$(curl -sS -o release.json -w '%{http_code}' --max-time 60 "${auth[@]}" \
            "${api}/releases/tags/${tag}")"
          if [[ "${rel_code:0:1}" == "2" ]]; then
            echo "Release ${tag} existiert bereits — Assets werden ergaenzt."
          else
            body="Plugin ${tag} — Assets siehe unten. Pruefsummen und signer_pubkey werden nach dem Workflow-Lauf aus den Job-Logs uebernommen (siehe README §3)."
            payload="$(jq -n --arg tag "$tag" --arg name "$tag" --arg body "$body" \
              '{tag_name:$tag, name:$name, body:$body, draft:false, prerelease:false}')"
            rel_code="$(curl -sS -o release.json -w '%{http_code}' --max-time 60 "${auth[@]}" \
              -H 'Content-Type: application/json' -X POST \
              --data-binary "$payload" "${api}/releases")"
            if [[ "${rel_code:0:1}" != "2" ]]; then
              echo "::error::Release ${tag} konnte nicht angelegt werden (HTTP ${rel_code})." >&2
              cat release.json >&2
              exit 1
            fi
            echo "Release ${tag} angelegt."
          fi

          # Release id from the API response — jq fails the step if absent, so
          # the upload can never run with an empty id.
          rel_id="$(jq -er '.id' release.json)"
          echo "release id=${rel_id}"

          # Upload the built asset. Gitea expects the file name as the ?name=
          # query parameter and the bytes as application/octet-stream form data.
          up_code="$(curl -sS -o upload.json -w '%{http_code}' --max-time 600 "${auth[@]}" \
            -H 'Content-Type: application/octet-stream' -X POST \
            --data-binary "@${asset}" \
            "${api}/releases/${rel_id}/assets?name=$(jq -rn --arg n "$asset" '$n|@uri')")"
          if [[ "${up_code:0:1}" != "2" ]]; then
            echo "::error::Asset ${asset} konnte nicht hochgeladen werden (HTTP ${up_code})." >&2
            cat upload.json >&2
            exit 1
          fi
          echo "Asset ${asset} hochgeladen (HTTP ${up_code})."

      - name: Zusammenfassung (für index.json-Pflege)
        shell: bash
        run: |
          echo "::notice::${GITHUB_REPOSITORY} ${GITHUB_REF_NAME} ${{ matrix.goos }}-${{ matrix.goarch }}"
          echo "::notice::sha256=${{ steps.asset.outputs.sha256 }}"
          echo "::notice::pubkey=${{ steps.asset.outputs.pubkey }}"
          echo "::notice::asset=${{ steps.asset.outputs.asset }}"

  # Aktualisiert index.json automatisch mit den ECHTEN Hashes der veröffentlichten
  # Release-Assets. Damit kann der in index.json gepflegte sha256 nicht mehr von den
  # ausgelieferten Bytes abdriften (die frühere Ursache für Fehl-Hashes: Hashes wurden
  # aus lokalen Builds eingetragen, während die CI neu gebaut hat).
  #
  # Die Dateien werden nach dem Upload erneut aus dem Release heruntergeladen und
  # gehasht — gemessen wird also exakt das, was ein Nutzer später herunterlädt.
  update-index:
    needs:
      - release
      - mirror-github
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main (Katalog-Zweig)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Plugin-Name und Version aus dem Tag ableiten
        id: tag
        shell: bash
        env:
          PLUGIN_NAME: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          name="${PLUGIN_NAME%-*}"
          version="${PLUGIN_NAME##*-}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: index.json auf die Release-Asset-Hashes pinnen
        shell: bash
        env:
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ -z "${GIT_TOKEN:-}" ]]; then
            echo "::error::Publish-Secret GIT_TOKEN fehlt oder ist leer. Release-Assets liegen auf Gitea (Source of Truth)." >&2
            exit 1
          fi
          # Gitea base URL comes from the workflow env (see top of file); it is
          # the container-reachable service URL, not localhost/github.server_url.
          if [[ -z "${GITEA_URL:-}" ]]; then
            echo "::error::GITEA_URL ist nicht gesetzt (Workflow-env fehlt)." >&2
            exit 1
          fi
          name="${{ steps.tag.outputs.name }}"
          version="${{ steps.tag.outputs.version }}"
          tag="${name}-${version}"
          repo="${GH_REPOSITORY}"
          api="${GITEA_URL%/}/api/v1/repos/${repo}"
          auth=( -H "Authorization: token ${GIT_TOKEN}" )
          echo "Sync ${name} ${version} aus Release ${tag} nach index.json"

          # Asset-Hashes direkt aus dem veröffentlichten Release gewinnen.
          # Fetch the release metadata, then download each asset by its API id
          # (the same bytes a user will later download) and hash them.
          tmp="$(mktemp -d)"
          rel_code="$(curl -sS -o "$tmp/release.json" -w '%{http_code}' --max-time 60 "${auth[@]}" \
            "${api}/releases/tags/${tag}")"
          if [[ "${rel_code:0:1}" != "2" ]]; then
            echo "::error::Gitea-Release ${tag} nicht lesbar (HTTP ${rel_code})." >&2
            cat "$tmp/release.json" >&2
            exit 1
          fi
          # Fail-closed: an empty asset list must not produce an empty hash file
          # that then silently leaves index.json unchanged.
          asset_count="$(jq -er '.assets | length' "$tmp/release.json")"
          if [[ "${asset_count}" -lt 1 ]]; then
            echo "::error::Gitea-Release ${tag} hat keine Assets — keine Hashes ableitbar." >&2
            exit 1
          fi
          # Release id from the same response — required by the asset download
          # endpoint /releases/{id}/assets/{attachment_id} (Gitea has no
          # /releases/assets/{id} shortcut).
          rel_id="$(jq -er '.id' "$tmp/release.json")"
          while IFS=$'\t' read -r aid aname; do
            curl -fsSL --max-time 600 "${auth[@]}" \
              "${api}/releases/${rel_id}/assets/${aid}" -o "$tmp/${aname}"
          done < <(jq -r '.assets[] | "\(.id)\t\(.name)"' "$tmp/release.json")
          # Only .glorious-plugin assets are hashed; fail if none matched.
          if ! ls "$tmp"/*.glorious-plugin >/dev/null 2>&1; then
            echo "::error::Keine .glorious-plugin-Assets im Release ${tag} gefunden." >&2
            exit 1
          fi
          (cd "$tmp" && sha256sum *.glorious-plugin > "$GITHUB_WORKSPACE/asset-hashes.txt")
          cat "$GITHUB_WORKSPACE/asset-hashes.txt"

          # index.json deterministisch aktualisieren: sha256, latest_version,
          # changelog UND die Tag-Segmente der Asset-URLs werden gemeinsam aus
          # dem Release-Tag abgeleitet, damit Version/Tag/URL/sha256 nicht mehr
          # auseinanderdriften (frühere Ursache: nur sha256/latest_version wurden
          # geschrieben, die URLs zeigten weiter auf den alten Tag).
          # Fail-closed Tag-Validierung VOR jeder Verwendung. Der Tag ist eine
          # vom Benutzer kontrollierte Zeichenkette und wird in Shell/JSON
          # interpoliert; ohne Gate sind Argument-Trennung (Leerzeichen),
          # JSON-Struktur-Smuggle (Anführungszeichen/Komma), Kommandoausführung
          # (Shell-Substitution), Semikolon-Trennung und Pfadsegmente (../)
          # möglich. Er muss dem Muster ^[A-Za-z0-9][A-Za-z0-9._-]*$ entsprechen
          # UND als <name>-<semver> parsebar sein, sonst exit 1.
          python3 - "$tag" "$name" "$version" <<'PY'
          import re, sys
          tag, name, version = sys.argv[1], sys.argv[2], sys.argv[3]
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]*", tag):
              print(
                  f"tag-validation: FAIL - tag {tag!r} verletzt "
                  r"^[A-Za-z0-9][A-Za-z0-9._-]*$ (erlaubt sind nur "
                  "Buchstaben, Ziffern, '.', '_' und '-', beginnend mit "
                  "Buchstabe/Ziffer).",
                  file=sys.stderr,
              )
              sys.exit(1)
          m = re.fullmatch(r"(.+)-([0-9]+\.[0-9]+\.[0-9]+)", tag)
          if not m or m.group(1) != name or m.group(2) != version:
              print(
                  f"tag-validation: FAIL - tag {tag!r} ist nicht als "
                  f"<name>-<semver> parsebar bzw. passt nicht zu "
                  f"name={name!r} version={version!r}.",
                  file=sys.stderr,
              )
              sys.exit(1)
          print(f"tag-validation: OK - {tag!r} -> name={name} version={version}")
          PY

          python3 - "$GITHUB_WORKSPACE/index.json" "$version" "$tag" "$name" "$GITHUB_WORKSPACE/asset-hashes.txt" <<'PY'
          import json, sys, pathlib, re
          idx_path = pathlib.Path(sys.argv[1])
          version = sys.argv[2]
          tag = sys.argv[3]
          name = sys.argv[4]
          hashes = {}
          for line in pathlib.Path(sys.argv[5]).read_text().splitlines():
              if not line.strip():
                  continue
              sha, fn = line.split()[0], line.split()[-1].lstrip("*")
              hashes[fn] = sha

          def retag(url: str, tag: str) -> str:
              # Ersetzt NUR das Tag-Segment nach .../releases/download/<tag>/
              # bzw. .../releases/tag/<tag> und lässt Host/Pfad/Dateinamen
              # unberührt.
              return re.sub(r"(/releases/(?:download|tag)/)[^/]+", r"\1" + tag, url, count=1)

          data = json.loads(idx_path.read_text(encoding="utf-8"))

          # NUR der Katalog-Eintrag des Plugins, zu dem das Release gehoert,
          # darf veraendert werden. Ein Release mit Tag 'hello-1.0.0' darf
          # einem zweiten Eintrag (z. B. 'wiki') weder latest_version noch
          # URL-Tag noch changelog stempeln; sonst ist die Datei nicht mehr aus
          # EINER Quelle konsistent. Deshalb gezielter Zugriff statt Schleife
          # ueber alle Eintraege.
          matches = [p for p in data.get("plugins", []) if p.get("name") == name]
          if len(matches) != 1:
              print(
                  f"index-sync: FAIL - erwarte genau einen Katalog-Eintrag "
                  f"fuer name={name!r}, gefunden: {len(matches)}.",
                  file=sys.stderr,
              )
              sys.exit(1)
          plugin = matches[0]

          for plat, info in plugin.get("platforms", {}).items():
              if "url" in info:
                  info["url"] = retag(info["url"], tag)
              fn = info["url"].rsplit("/", 1)[-1]
              # sha256 bleibt ueber den Dateinamen auf genau dieses Plugin
              # beschraenkt: nur Hashes, die zu den Asset-Dateinamen dieses
              # Plugins gehoeren, werden uebernommen.
              if fn in hashes:
                  info["sha256"] = hashes[fn]
          plugin["latest_version"] = version
          if "changelog" in plugin:
              plugin["changelog"] = retag(plugin["changelog"], tag)
          idx_path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          PY

      - name: index.json committen und pushen
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.json; then
            echo "index.json ist bereits aktuell — kein Commit nötig."
            exit 0
          fi
          git diff -- index.json
          git config user.name "glorious-ci[bot]"
          git config user.email "glorious-ci[bot]@users.noreply.github.com"
          git add index.json
          git commit -m "chore(index): sync ${{ steps.tag.outputs.name }} ${{ steps.tag.outputs.version }} sha256 to published release assets"
          git push origin HEAD:main

  # ---------------------------------------------------------------------------
  # mirror-github: spiegelt die auf GITEA erzeugten Release-Assets nach GitHub.
  #
  # Warum ein eigener Job: Der GitHub-Repo ist ein Push-Mirror, der NUR Git-Refs
  # spiegelt — Releases/Assets werden NICHT mitgespiegelt. Ohne diesen Job zeigen
  # die in index.json hinterlegten Download-URLs (GitHub) ins Leere.
  #
  # Fail-closed: fehlt das Secret GH_PAT oder scheitert der Upload, wird der Job
  # ROT und bricht damit die gesamte Pipeline ab (update-index/verify-consistency
  # hängen per needs daran).
  # ---------------------------------------------------------------------------
  mirror-github:
    needs: release
    runs-on: ubuntu-latest
    env:
      # Fixed, public GitHub coordinates for the mirror target. Kept as env so
      # the api.github.com calls below cannot accidentally target the Gitea
      # host (which is the case when reusing github.server_url on a Gitea run).
      GH_API: "https://api.github.com"
    steps:
      - name: Plugin-Name und Version aus dem Tag ableiten
        id: tag
        shell: bash
        env:
          PLUGIN_NAME: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          name="${PLUGIN_NAME%-*}"
          version="${PLUGIN_NAME##*-}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: GitHub-Mirror vorbereiten
        shell: bash
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # fail-closed: ohne GitHub-PAT kein Mirror.
          if [[ -z "${GH_PAT:-}" ]]; then
            echo "::error::Secret GH_PAT fehlt oder ist leer. Der GitHub-Mirror ist PFLICHT, sonst sind die Download-URLs in index.json tot." >&2
            echo "Fix: Repository > Settings > Actions > Secrets > New secret 'GH_PAT' (classic PAT, Scopes repo + workflow). Siehe README §4 'GitHub-Mirror-Secret'." >&2
            exit 1
          fi
          # fail-closed: ohne Gitea-Token können die Quell-Assets nicht geladen werden.
          if [[ -z "${GIT_TOKEN:-}" ]]; then
            echo "::error::Secret GIT_TOKEN fehlt oder ist leer — Quell-Assets des Releases sind nicht lesbar (Gitea = Source of Truth)." >&2
            exit 1
          fi
          # Gitea base URL from the workflow env (container-reachable); the
          # GitHub side uses the fixed GH_API host, never github.server_url.
          if [[ -z "${GITEA_URL:-}" ]]; then
            echo "::error::GITEA_URL ist nicht gesetzt (Workflow-env fehlt)." >&2
            exit 1
          fi

          name="${{ steps.tag.outputs.name }}"
          version="${{ steps.tag.outputs.version }}"
          tag="${name}-${version}"
          echo "Spiegele Release ${tag} von Gitea nach GitHub (${GH_REPOSITORY})."

          gitea_api="${GITEA_URL%/}/api/v1/repos/${GH_REPOSITORY}"
          gh_api="${GH_API}"

          # 1) Quelle: Gitea-Release + Asset-Liste (Assets liegen auf Gitea).
          g_code="$(curl -sS -o release-gitea.json -w '%{http_code}' --max-time 60 \
            -H "Authorization: token ${GIT_TOKEN}" \
            "${gitea_api}/releases/tags/${tag}")"
          if [[ "${g_code:0:1}" != "2" ]]; then
            echo "::error::Gitea-Release ${tag} nicht lesbar (HTTP ${g_code})." >&2
            cat release-gitea.json >&2
            exit 1
          fi
          asset_count="$(jq -er '.assets | length' release-gitea.json)"
          echo "Gitea-Assets gefunden: ${asset_count}"
          if [[ "${asset_count}" -lt 1 ]]; then
            echo "::error::Gitea-Release ${tag} hat keine Assets — nichts zu spiegeln." >&2
            exit 1
          fi

          # 2) Ziel: GitHub-Release anlegen (idempotent) oder bestehendes holen.
          #    curl + REST instead of gh: the runner job image does NOT ship the
          #    gh CLI (verified: 'command -v gh' -> not found), so any gh call
          #    would abort the job. The REST contract is stable and explicit.
          gh_headers=( -H "Authorization: Bearer ${GH_PAT}" \
                       -H "Accept: application/vnd.github+json" \
                       -H "X-GitHub-Api-Version: 2022-11-28" )
          ghr_code="$(curl -sS -o gh-release.json -w '%{http_code}' --max-time 60 "${gh_headers[@]}" \
            "${gh_api}/repos/${GH_REPOSITORY}/releases/tags/${tag}")"
          if [[ "${ghr_code:0:1}" == "2" ]]; then
            echo "GitHub-Release ${tag} existiert — Assets werden ersetzt."
          else
            payload="$(jq -n --arg tag "$tag" \
              '{tag_name:$tag, name:$tag, draft:false, prerelease:false, body:("Mirror of the Gitea release " + $tag + " (assets are published on Gitea first; this is a read-only mirror).")}')"
            ghr_code="$(curl -sS -o gh-release.json -w '%{http_code}' --max-time 60 "${gh_headers[@]}" \
              -H 'Content-Type: application/json' -X POST \
              --data-binary "$payload" "${gh_api}/repos/${GH_REPOSITORY}/releases")"
            if [[ "${ghr_code:0:1}" != "2" ]]; then
              echo "::error::GitHub-Release ${tag} konnte nicht angelegt werden (HTTP ${ghr_code})." >&2
              cat gh-release.json >&2
              exit 1
            fi
          fi
          gh_release_id="$(jq -er '.id' gh-release.json)"
          echo "GitHub release id=${gh_release_id}"

          # 3) Assets von Gitea herunterladen und nach GitHub hochladen.
          #    First drop any same-named GitHub asset so the upload replaces it
          #    (the old '--clobber' semantics), then POST the new bytes to the
          #    uploads endpoint parsed from the release's upload_url.
          upload_url="$(jq -er '.upload_url' gh-release.json | sed 's/{?name,label}//')"
          # Gitea release id — partner of the asset download endpoint
          # /releases/{id}/assets/{attachment_id} used below.
          g_rel_id="$(jq -er '.id' release-gitea.json)"
          work="$(mktemp -d)"
          while IFS=$'\t' read -r aid aname; do
            echo "-> ${aname}"
            curl -fsSL --max-time 600 \
              -H "Authorization: token ${GIT_TOKEN}" \
              "${gitea_api}/releases/${g_rel_id}/assets/${aid}" -o "${work}/${aname}"
            # Remove a pre-existing asset with the same name (idempotent rerun).
            old_id="$(curl -sS --max-time 60 "${gh_headers[@]}" \
              "${gh_api}/repos/${GH_REPOSITORY}/releases/${gh_release_id}/assets?per_page=100" \
              | jq -r --arg n "$aname" '.[] | select(.name==$n) | .id')"
            if [[ -n "${old_id}" ]]; then
              curl -sS -o /dev/null -X DELETE --max-time 60 "${gh_headers[@]}" \
                "${gh_api}/repos/${GH_REPOSITORY}/releases/assets/${old_id}"
            fi
            up_code="$(curl -sS -o upload-gh.json -w '%{http_code}' --max-time 600 "${gh_headers[@]}" \
              -H 'Content-Type: application/octet-stream' -X POST \
              --data-binary "@${work}/${aname}" \
              "${upload_url}?name=$(jq -rn --arg n "$aname" '$n|@uri')")"
            if [[ "${up_code:0:1}" != "2" ]]; then
              echo "::error::GitHub-Asset ${aname} konnte nicht hochgeladen werden (HTTP ${up_code})." >&2
              cat upload-gh.json >&2
              exit 1
            fi
          done < <(jq -r '.assets[] | "\(.id)\t\(.name)"' release-gitea.json)

          echo "Mirror abgeschlossen: ${asset_count} Assets für ${tag} auf GitHub."
          rm -f release-gitea.json gh-release.json

  # ---------------------------------------------------------------------------
  # verify-consistency: scharfer Konsistenz-Gate NACH Release + Mirror + index.
  #
  # Für jede Plattform eines Plugins wird der sha256 des Assets in DREI Quellen
  # verglichen:
  #   1) GitHub-Release-Asset  (Release-Download-URL aus index.json, "das
  #      ausgelieferte Byte", das Nutzer tatsächlich herunterladen)
  #   2) Gitea-Release-Asset   (Source of Truth)
  #   3) index.json            (Katalog-Eintrag platform.<plat>.sha256)
  # Alle drei müssen für JEDES Plattform-Asset identisch sein. Jede Abweichung
  # macht den Job ROT und listet Asset-Name + alle drei Werte auf.
  # ---------------------------------------------------------------------------
  verify-consistency:
    needs:
      - release
      - mirror-github
      - update-index
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (Katalog-Zweig)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Hash-Konsistenz Gitea == GitHub == index.json prüfen
        shell: bash
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_API: "https://api.github.com"
          # Same tag-resolution rule as the other jobs: tag push -> ref_name,
          # manual dispatch -> version input.
          PLUGIN_NAME: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_PAT:-}" || -z "${GIT_TOKEN:-}" ]]; then
            echo "::error::Für die Konsistenzprüfung sind GIT_TOKEN (Gitea) und GH_PAT (GitHub) PFLICHT." >&2
            exit 1
          fi
          if [[ -z "${GITEA_URL:-}" ]]; then
            echo "::error::GITEA_URL ist nicht gesetzt (Workflow-env fehlt)." >&2
            exit 1
          fi
          # Pass the tag via env (not a direct ${{ }} interpolation) so an
          # operator-supplied dispatch input cannot break out into the shell.
          tag="${PLUGIN_NAME}"
          gitea_api="${GITEA_URL%/}/api/v1/repos/${GH_REPOSITORY}"
          gh_api="${GH_API}"
          work="$(mktemp -d)"
          fail=0

          gh_headers=( -H "Authorization: Bearer ${GH_PAT}" \
                       -H "Accept: application/vnd.github+json" \
                       -H "X-GitHub-Api-Version: 2022-11-28" )

          # Gitea assets (name -> id) and GitHub assets (name -> download url).
          # Both endpoints are called with curl (the runner image has no gh).
          g_code="$(curl -sS -o "$work/gitea.json" -w '%{http_code}' --max-time 60 \
            -H "Authorization: token ${GIT_TOKEN}" \
            "${gitea_api}/releases/tags/${tag}")"
          if [[ "${g_code:0:1}" != "2" ]]; then
            echo "::error::Gitea-Release ${tag} nicht lesbar (HTTP ${g_code})." >&2
            cat "$work/gitea.json" >&2
            exit 1
          fi
          h_code="$(curl -sS -o "$work/github.json" -w '%{http_code}' --max-time 60 "${gh_headers[@]}" \
            "${gh_api}/repos/${GH_REPOSITORY}/releases/tags/${tag}")"
          if [[ "${h_code:0:1}" != "2" ]]; then
            echo "::error::GitHub-Release ${tag} nicht lesbar (HTTP ${h_code})." >&2
            cat "$work/github.json" >&2
            exit 1
          fi

          python3 - "$GITHUB_WORKSPACE/index.json" "$work/gitea.json" "$work/github.json" <<'PY'
          import json, sys
          idx = json.load(open(sys.argv[1], encoding="utf-8"))
          gitea = {a["name"]: a for a in json.load(open(sys.argv[2]))["assets"]}
          github = {a["name"]: a for a in json.load(open(sys.argv[3]))["assets"]}
          missing = []
          for plugin in idx.get("plugins", []):
              for plat, info in plugin.get("platforms", {}).items():
                  fn = info["url"].rsplit("/", 1)[-1]
                  if fn not in gitea:
                      missing.append(f"{plugin['name']}/{plat}: {fn} fehlt im Gitea-Release")
                  if fn not in github:
                      missing.append(f"{plugin['name']}/{plat}: {fn} fehlt im GitHub-Release")
          if missing:
              print("::error::Assets fehlen für die Konsistenzprüfung:")
              for m in missing:
                  print("  -", m)
              sys.exit(1)
          print(f"OK: {sum(len(p.get('platforms', {})) for p in idx.get('plugins', []))} Plattform-Assets in beiden Releases vorhanden.")
          PY

          # Byte-genauer Vergleich: GitHub-Asset == Gitea-Asset == index.json.
          # Download each GitHub release asset via the REST API (the runner
          # image has no gh). Use the per-asset API endpoint with
          # Accept: application/octet-stream; browser_download_url is not
          # usable for a private repo from CI without a browser session.
          mkdir -p "$work/gh"
          while IFS=$'\t' read -r aname aurl; do
            curl -fsSL --max-time 600 "${gh_headers[@]}" \
              -H "Accept: application/octet-stream" \
              "$aurl" -o "$work/gh/${aname}"
          done < <(jq -r '.assets[] | "\(.name)\t\(.url)"' "$work/github.json")
          while IFS= read -r fn; do
            gh_sha="$(sha256sum "$work/gh/${fn}" | awk '{print $1}')"
            idx_sha="$(python3 - "$GITHUB_WORKSPACE/index.json" "$fn" <<'PY'
          import json, sys
          idx = json.load(open(sys.argv[1], encoding="utf-8"))
          for p in idx.get("plugins", []):
              for _, info in p.get("platforms", {}).items():
                  if info["url"].rsplit("/", 1)[-1] == sys.argv[2]:
                      print(info.get("sha256", ""))
          PY
          )"
            echo "Asset ${fn}: github=${gh_sha} index.json=${idx_sha}"
            if [[ -z "${idx_sha}" || "${gh_sha}" != "${idx_sha}" ]]; then
              echo "::error::HASH-MISMATCH ${fn}: github=${gh_sha} index.json=${idx_sha}" >&2
              fail=1
            fi
          done < <(ls "$work/gh")
          if [[ "$fail" -ne 0 ]]; then
            echo "::error::Konsistenzprüfung fehlgeschlagen — GitHub-Assets und index.json weichen ab." >&2
            exit 1
          fi
          echo "Konsistenzprüfung grün: alle Assets stimmen zwischen GitHub und index.json überein."
