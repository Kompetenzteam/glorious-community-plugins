# Release-Workflow für das Glorious Community Plugin Repository
#
# Tag-getriggert: git tag <plugin>-<version> && git push origin <tag>
# z. B. `wiki-1.2.0` -> Plugin "wiki", Version "1.2.0".
#
# Der Workflow baut das Plugin-Binary in einer GOOS/GOARCH-Matrix, signiert das
# manifest.json mit dem Ed25519-Key aus dem Secret SIGNING_KEY, validiert README
# und functions.json, erzeugt die .glorious-plugin-ZIPs und veröffentlicht ein
# GitHub-Release mit allen Assets.
#
# Secrets (Repository > Settings > Secrets and variables > Actions):
#   SIGNING_KEY   Ed25519-Private-Key des Autors — PKCS#8-PEM ("-----BEGIN PRIVATE
#                 KEY-----", mehrzeilig) ODER Base64 davon. Wird NIE ausgegeben.
#
# MIT License — Vorlage für Plugin-Autoren, frei anpassbar.
name: Release Plugin

on:
  push:
    tags:
      - "*-*.*.*" # Plugin-Tags im Format <plugin>-<version> (SemVer), z. B. hello-0.1.0.
                  # Bootstrap-Tags wie v0.1.0 (manuell erstellte Team-Releases) triggern den Workflow nicht.

permissions:
  contents: write # für gh release create

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            ext: .exe
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: darwin
            goarch: arm64
            ext: ""
    runs-on: ubuntu-latest
    env:
      PLUGIN_NAME: ${{ github.ref_name }} # z. B. wiki-1.2.0
      GO_VERSION: "1.26"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Plugin-Name und Version aus dem Tag ableiten
        id: tag
        shell: bash
        run: |
          # Tag-Format: <plugin>-<version> mit SemVer-Version, z. B. wiki-1.2.0.
          name="${PLUGIN_NAME%-*}"
          version="${PLUGIN_NAME##*-}"
          if [[ -z "$name" || ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '$PLUGIN_NAME' entspricht nicht <plugin>-<version> (SemVer)." >&2
            exit 1
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Signing-Key bereitstellen (PEM oder Base64)
        shell: bash
        run: |
          # Akzeptiert PKCS#8-PEM und Base64(PEM). Das Secret wird nur in
          # key.pem materialisiert und ist nie in Logs/Outputs sichtbar.
          printf '%s' "$SIGNING_KEY" > key.pem
          if ! grep -q -- "-----BEGIN" key.pem; then
            if ! base64 -d key.pem > key.dec 2>/dev/null; then
              echo "SIGNING_KEY ist weder PEM noch Base64." >&2
              exit 1
            fi
            mv key.dec key.pem
          fi
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            plugins/${{ steps.tag.outputs.name }}/go.mod
            tools/build-plugin/go.mod

      - name: Builder-Tooling bauen
        working-directory: tools/build-plugin
        run: go build -o ../../build-plugin .

      - name: Plugin-Binary bauen (${{ matrix.goos }}/${{ matrix.goarch }})
        shell: bash
        working-directory: plugins/${{ steps.tag.outputs.name }}
        run: |
          # Go-Plugins: direkt bauen. Andere Sprachen: build.sh bereitstellen.
          # Das Binary heisst wie das Plugin (<name>), passend zum Manifest-
          # Entrypoint ./<name> (bzw. ./<name>.exe unter Windows) — der
          # Plugin-Host loest den Entrypoint WOERTLICH relativ zum Arbeits-
          # verzeichnis auf und leitet KEINE .exe-Endung ab.
          if [[ -f go.mod ]]; then
            GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
              go build -trimpath -ldflags "-s -w" -o "${{ steps.tag.outputs.name }}${{ matrix.ext }}" .
          elif [[ -f build.sh ]]; then
            GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} ./build.sh "${{ steps.tag.outputs.name }}${{ matrix.ext }}"
          else
            echo "plugins/<name> braucht go.mod oder build.sh." >&2
            exit 1
          fi

      - name: Manifest-Entrypoint an die Plattform anpassen
        id: entry
        shell: bash
        working-directory: plugins/${{ steps.tag.outputs.name }}
        run: |
          # M1-Fix: ein einziges Repo-Manifest kann nicht gleichzeitig "./hello"
          # (Unix) und "./hello.exe" (Windows) fordern. Der Host loest den
          # Entrypoint woertlich auf, wir patchen deshalb eine KOPIE des
          # Manifests je Matrix-Lauf und lassen das Repo-Manifest unangetastet.
          # Der Unix-Name ist der Repo-Default (./hello); Windows bekommt .exe.
          cp manifest.json manifest.build.json
          if [[ "${{ matrix.goos }}" == "windows" ]]; then
            entry="./${{ steps.tag.outputs.name }}.exe"
          else
            entry="./${{ steps.tag.outputs.name }}"
          fi
          # Kein Heredoc: der YAML-Block-Skalar endet an einer Zeile ohne
          # Einrueckung, ein Heredoc-Body auf Spalte 0 wuerde die YAML-Struktur
          # zerstoeren. Daher ein einzelner python3 -c-Aufdruck.
          python3 -c 'import json,sys; p=sys.argv[1]; d=json.load(open(p,encoding="utf-8")); d["entrypoint"]=sys.argv[2]; open(p,"w",encoding="utf-8").write(json.dumps(d,indent=2,ensure_ascii=False)+"\n")' manifest.build.json "$entry"
          echo "entrypoint=$entry" >> "$GITHUB_OUTPUT"

      - name: Plugin-ZIP bauen, validieren und signieren
        shell: bash
        working-directory: plugins/${{ steps.tag.outputs.name }}
        run: |
          set -euo pipefail
          bin="${{ steps.tag.outputs.name }}${{ matrix.ext }}"
          out="../../${{ steps.tag.outputs.name }}-${{ matrix.goos }}-${{ matrix.goarch }}.glorious-plugin"
          # Das gepatchte Manifest (manifest.build.json) geht in das ZIP, damit
          # der Entrypoint exakt zum Binary-Namen im Archiv passt (Windows:
          # hello.exe). Die Signatur deckt damit das plattformkorrekte Manifest ab.
          args=(--manifest manifest.build.json --functions functions.json --readme README.md
                --binary "$bin" --out "$out" --signing-key ../../key.pem)
          [[ -d assets ]] && args+=(--asset assets)
          ../../build-plugin "${args[@]}"
          rm -f manifest.build.json

      - name: Prüfsummen + Public Key ermitteln
        id: asset
        shell: bash
        run: |
          file="${{ steps.tag.outputs.name }}-${{ matrix.goos }}-${{ matrix.goarch }}.glorious-plugin"
          echo "sha256=$(sha256sum "$file" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "asset=$file" >> "$GITHUB_OUTPUT"
          # build-plugin wurde ins Repo-Root gebaut; dieser Schritt läuft dort.
          echo "pubkey=$(./build-plugin --print-pubkey --signing-key key.pem)" >> "$GITHUB_OUTPUT"

      - name: Release-Assets hochladen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="${{ steps.asset.outputs.asset }}"
          tag="${{ github.ref_name }}"
          # Release beim ersten Matrix-Job anlegen, danach Assets ergänzen.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" --clobber
          else
            gh release create "$tag" "$asset" \
              --title "$tag" \
              --notes "Plugin $tag — Assets siehe unten. Prüfsummen und signer_pubkey werden nach dem Workflow-Lauf aus den Job-Logs übernommen (siehe README §3)."
          fi

      - name: Zusammenfassung (für index.json-Pflege)
        shell: bash
        run: |
          echo "::notice::${GITHUB_REPOSITORY} ${GITHUB_REF_NAME} ${{ matrix.goos }}-${{ matrix.goarch }}"
          echo "::notice::sha256=${{ steps.asset.outputs.sha256 }}"
          echo "::notice::pubkey=${{ steps.asset.outputs.pubkey }}"
          echo "::notice::asset=${{ steps.asset.outputs.asset }}"

  # Aktualisiert index.json automatisch mit den ECHTEN Hashes der veröffentlichten
  # Release-Assets. Damit kann der in index.json gepflegte sha256 nicht mehr von den
  # ausgelieferten Bytes abdriften (die frühere Ursache für Fehl-Hashes: Hashes wurden
  # aus lokalen Builds eingetragen, während die CI neu gebaut hat).
  #
  # Die Dateien werden nach dem Upload erneut aus dem Release heruntergeladen und
  # gehasht — gemessen wird also exakt das, was ein Nutzer später herunterlädt.
  update-index:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main (Katalog-Zweig)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Plugin-Name und Version aus dem Tag ableiten
        id: tag
        shell: bash
        env:
          PLUGIN_NAME: ${{ github.ref_name }}
        run: |
          name="${PLUGIN_NAME%-*}"
          version="${PLUGIN_NAME##*-}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: index.json auf die Release-Asset-Hashes pinnen
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          name="${{ steps.tag.outputs.name }}"
          version="${{ steps.tag.outputs.version }}"
          tag="${{ github.ref_name }}"
          echo "Sync ${name} ${version} aus Release ${tag} nach index.json"

          # Asset-Hashes direkt aus dem veröffentlichten Release gewinnen.
          tmp="$(mktemp -d)"
          gh release download "$tag" --repo "${{ github.repository }}" --dir "$tmp" --clobber
          (cd "$tmp" && sha256sum *.glorious-plugin > "$GITHUB_WORKSPACE/asset-hashes.txt")
          cat "$GITHUB_WORKSPACE/asset-hashes.txt"

          # index.json deterministisch aktualisieren (nur sha256 + latest_version/changelog).
          python3 - "$GITHUB_WORKSPACE/index.json" "$version" "$GITHUB_WORKSPACE/asset-hashes.txt" <<'PY'
          import json, sys, pathlib
          idx_path = pathlib.Path(sys.argv[1])
          version = sys.argv[2]
          hashes = {}
          for line in pathlib.Path(sys.argv[3]).read_text().splitlines():
              if not line.strip():
                  continue
              sha, fn = line.split()[0], line.split()[-1].lstrip("*")
              hashes[fn] = sha
          data = json.loads(idx_path.read_text(encoding="utf-8"))
          for plugin in data.get("plugins", []):
              for plat, info in plugin.get("platforms", {}).items():
                  fn = info["url"].rsplit("/", 1)[-1]
                  if fn in hashes:
                      info["sha256"] = hashes[fn]
              plugin["latest_version"] = version
          idx_path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          PY

      - name: index.json committen und pushen
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.json; then
            echo "index.json ist bereits aktuell — kein Commit nötig."
            exit 0
          fi
          git diff -- index.json
          git config user.name "glorious-ci[bot]"
          git config user.email "glorious-ci[bot]@users.noreply.github.com"
          git add index.json
          git commit -m "chore(index): sync ${{ steps.tag.outputs.name }} ${{ steps.tag.outputs.version }} sha256 to published release assets"
          git push origin HEAD:main
